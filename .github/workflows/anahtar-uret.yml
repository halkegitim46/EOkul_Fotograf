name: Imza anahtari uret (bir kez)

# Yalnızca bir kez, elle çalıştırılır. ÖZEL (private) depoda kullanın.
# Çıktıdaki dosyayı indirip içeriğini GitHub Secrets'a ekledikten sonra
# bu çalıştırmayı ve yüklenen dosyayı (Artifacts) silin.
on:
  workflow_dispatch:

jobs:
  anahtar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Anahtarı üret
        run: |
          PASS=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
          keytool -genkeypair -keystore eokul.jks -storepass "$PASS" -keypass "$PASS" \
            -alias eokul -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=E-Okul Foto Studio" 2>/dev/null
          {
            echo "EOKUL_KEYSTORE_PASSWORD=$PASS"
            echo "EOKUL_KEY_ALIAS=eokul"
            echo "EOKUL_KEY_PASSWORD=$PASS"
            echo "EOKUL_KEYSTORE_BASE64="
            base64 -w0 eokul.jks
            echo
          } > eokul-anahtar.b64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: imza-anahtari
          path: eokul-anahtar.b64.txt
          retention-days: 1
