name: Imza anahtari uret (bir kez)

# DİKKAT: Bu iş akışı YENİ ve FARKLI bir imza anahtarı üretir. Zaten kendi anahtarınızı
# KEYSTORE_BASE64 gizli değişkeni olarak yüklediyseniz BUNU ÇALIŞTIRMAYIN: yeni anahtar eskisiyle aynı olmaz ve
# uygulama güncellemeleri mevcut kurulumun üstüne kurulmaz.
# Yalnızca hiç anahtarınız yoksa, bir kez, elle ve ÖZEL (private) depoda çalıştırın. Çıktıdaki dosyadaki
# dört değeri GitHub Secrets'a ekledikten sonra bu çalıştırmayı ve yüklenen dosyayı (Artifacts) silin.
on:
  workflow_dispatch:

jobs:
  anahtar:
    runs-on: ubuntu-24.04
    steps:
      - name: Anahtar zaten tanımlıysa dur
        env:
          VAR: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$VAR" ]; then
            echo "::error::KEYSTORE_BASE64 zaten tanımlı. Yeni anahtar üretmek mevcut anahtarınızın yerini alır ve güncellemeler eski kurulumun üstüne kurulmaz. Gerçekten istiyorsanız önce o gizli değişkeni silin."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Anahtarı üret
        run: |
          PASS=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
          keytool -genkeypair -keystore eokul.jks -storepass "$PASS" -keypass "$PASS" \
            -alias eokul -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=E-Okul Foto Studio" 2>/dev/null
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=eokul"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64="
            base64 -w0 eokul.jks
            echo
          } > anahtar.b64.txt

      - uses: actions/upload-artifact@v5
        with:
          name: imza-anahtari
          path: anahtar.b64.txt
          retention-days: 1
