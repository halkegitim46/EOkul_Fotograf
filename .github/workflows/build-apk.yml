name: Android CI + Release

# Tek workflow, tek sürüm kaynağı (anahtar üretmez; yalnızca sizin yüklediğiniz gizli değişkenleri kullanır):
#  - PR           → debug APK + birim testleri + R8 (imzasız) doğrulama
#  - push (main)  → debug APK + testler + İMZALI release APK (R8'li)
#  - Run workflow → aynısı (release işaretliyse imzalı APK da)
#  - v* tag push  → aynısı + GitHub Release
# Gerekli gizli değişkenler: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "İmzalı release APK da üretilsin mi?"
        type: boolean
        default: true
      version_name:
        description: "Sürüm adı (boşsa 1.0.<çalıştırma no>; örn. 1.2.0)"
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            NAME="$INPUT_VERSION"
          else
            NAME="1.0.${{ github.run_number }}"
          fi
          NAME="$(printf '%s' "$NAME" | tr -c 'A-Za-z0-9._-' '_')"
          CODE="${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "### Sürüm: \`$NAME\` (code \`$CODE\`)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Android SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Birim testleri
        run: gradle testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Debug APK derle
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: APK'yı sürümlü ada kopyala
        shell: bash
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$SRC" "out/E_Okul_Foto_Studio_v${VERSION_NAME}-debug.apk"
          ls -lh out/

      - name: Hata özeti (başarısızsa)
        if: failure()
        shell: bash
        run: |
          {
            echo '### Derleme hatası — son hata satırları'
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved|Execution failed" build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test raporunu yükle (hata olursa)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-raporu
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Derleme logunu yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: E_Okul_Foto_Studio-v${{ needs.version.outputs.version_name }}-debug-apk
          path: out/*.apk
          if-no-files-found: error

  # PR'larda: R8 kuralları release'i patlatıyor mu? (imzasız, gizli değişken gerekmez)
  r8-rules-check:
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Release (R8) derle — imzasız doğrulama
        run: gradle assembleRelease --no-daemon --stacktrace --console=plain

  # İmzalı release APK (R8'li). Debug build ve testler geçmeden üretilmez.
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true') ||
      github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Android SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Keystore'u çöz
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret tanımlı değil"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK derle (R8)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace --console=plain

      - name: APK imzasını doğrula
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then echo "::error::Release APK bulunamadı"; exit 1; fi
          for f in "${APKS[@]}"; do
            "$APKSIGNER" verify --print-certs "$f" | tee imza.txt | head -5
          done
          if grep -qi "Android Debug" imza.txt; then
            echo "::error::APK debug anahtarıyla imzalanmış. KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD değerlerini kontrol edin."
            exit 1
          fi
          {
            echo "### ✅ RELEASE APK (kendi anahtarınızla imzalı)"
            grep -E "Signer #1 certificate (DN|SHA-256)" imza.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yı sürümlü ada kopyala
        shell: bash
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" "out/E_Okul_Foto_Studio_v${VERSION_NAME}.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v6
        with:
          name: E_Okul_Foto_Studio-v${{ needs.version.outputs.version_name }}-release-apk
          path: out/E_Okul_Foto_Studio_v*.apk
          if-no-files-found: error

      - name: GitHub Release'e ekle (yalnızca tag'de)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: E_Okul_Foto_Studio v${{ needs.version.outputs.version_name }}
          files: out/E_Okul_Foto_Studio_v*.apk

      - name: Release özeti
        if: always()
        shell: bash
        run: |
          {
            echo "## Release özeti"
            echo "- **VERSION_NAME:** $VERSION_NAME"
            echo "- **VERSION_CODE:** $VERSION_CODE"
            echo "- **İmzalı APK:** E_Okul_Foto_Studio_v${VERSION_NAME}.apk"
            echo "- **GitHub Release:** ${{ startsWith(github.ref, 'refs/tags/') && 'oluşturuldu' || 'atlandı (tag değil)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
