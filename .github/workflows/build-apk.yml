name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Birim testleri
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Test raporunu yükle (hata olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: İmza anahtarını hazırla
        env:
          KS_B64: ${{ secrets.EOKUL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/eokul.jks"
            echo "EOKUL_KEYSTORE_FILE=$RUNNER_TEMP/eokul.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::EOKUL_KEYSTORE_BASE64 gizli değişkeni yok; APK debug anahtarıyla imzalanacak (güncellemeler eskisinin üstüne kurulmaz)."
          fi

      - name: Release APK derle
        env:
          EOKUL_KEYSTORE_PASSWORD: ${{ secrets.EOKUL_KEYSTORE_PASSWORD }}
          EOKUL_KEY_ALIAS: ${{ secrets.EOKUL_KEY_ALIAS }}
          EOKUL_KEY_PASSWORD: ${{ secrets.EOKUL_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: İmzayı doğrula
        env:
          KS_B64: ${{ secrets.EOKUL_KEYSTORE_BASE64 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee imza.txt
          {
            echo "### APK imzası"
            grep -E "Signer #1 certificate (DN|SHA-256)" imza.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$KS_B64" ] && grep -qi "Android Debug" imza.txt; then
            echo "::error::Anahtar tanımlı ama APK debug anahtarıyla imzalanmış. Gizli değişkenleri (şifre, takma ad) kontrol edin."
            exit 1
          fi

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: EOkulFotoStudio-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
